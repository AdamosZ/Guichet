[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guichet"
version = "0.1.0"
description = "Evaluation harness for cross-lingual retrieval over French administrative documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adam Abdelkefi" }]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only needed to (re)compute data/translations/; the eval reads the cache.
translate = ["torch", "transformers", "sentencepiece", "sacremoses"]
generate = ["anthropic>=0.40"]
judge = ["anthropic>=0.40", "inspect-ai>=0.3"]
app = ["anthropic>=0.40", "fastapi>=0.110", "uvicorn>=0.29", "huggingface_hub>=0.25"]

[tool.setuptools]
packages = ["guichet", "scripts"]
py-modules = ["app", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long French strings in the seed data
