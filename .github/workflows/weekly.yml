# Every Monday, for free:
#   1. re-download the official pages; changed pages replace the app's copies;
#      test answers whose evidence no longer holds go back to human review;
#   2. re-run the retrieval eval and compare with last week;
#   3. commit the updated pages and redeploy the app (if hosting is set up);
#   4. summarise last week's use and delete logs older than 90 days;
#   5. open one GitHub issue with everything (GitHub e-mails it to you).
# To enable: move this file to .github/workflows/weekly.yml. For the usage part,
# add in GitHub → Settings → Secrets and variables → Actions:
#   secret   HF_TOKEN       a Hugging Face token (read + write, for the purge)
#   variable HF_LOG_REPO    e.g. AdamosZ/guichet-logs
# Without them everything else still runs.
name: weekly

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the updated pages
  actions: write    # start the deploy workflow
  issues: write     # open the report

concurrency: weekly

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[app]"
      - name: Reuse last week's embeddings (only changed paragraphs are re-embedded)
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            ~/.cache/fastembed
          key: emb-${{ github.run_id }}
          restore-keys: emb-
      - name: Update changed pages, triage the answer key, re-run the eval
        run: python -m scripts.freshness --auto
      - name: Commit the updates
        id: commit
        run: |
          git add data/corpus evals reports/retrieval.json reports/freshness.json reports/freshness.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "guichet-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Weekly freshness: update official pages ($(date +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy the app with the new pages
        if: steps.commit.outputs.changed == 'true' && vars.HF_SPACE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Last week's usage (and delete expired logs)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ vars.HF_LOG_REPO }}" ]; then
            python -m scripts.weekly_report --hf "${{ vars.HF_LOG_REPO }}" --purge
          else
            python -m scripts.weekly_report
          fi
      - name: Open the report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat reports/weekly.md
            n=$(python -c "import json;print(len(json.load(open('reports/freshness.json'))['changed']))")
            if [ "$n" -gt 0 ]; then echo; echo "---"; cat reports/freshness.md; fi
            echo; echo "cc @${{ github.repository_owner }}"
          } > issue.md
          cat issue.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "Weekly report $(date +%F)" --body-file issue.md
