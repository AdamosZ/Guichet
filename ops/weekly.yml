# Every Monday: check the official pages, summarise last week's use of the app,
# delete logs older than 90 days, and open one GitHub issue with the report
# (GitHub e-mails it to you).
# To enable: move this file to .github/workflows/weekly.yml. For the usage part,
# add in GitHub → Settings → Secrets and variables → Actions:
#   secret   HF_TOKEN       a Hugging Face token (read + write, for the purge)
#   variable HF_LOG_REPO    e.g. AdamosZ/guichet-logs
# Without them the report still runs, with the page check only.
name: weekly

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[app]"
      - name: Official pages changed?
        run: python -m scripts.freshness
      - name: Last week's usage (and delete expired logs)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ vars.HF_LOG_REPO }}" ]; then
            python -m scripts.weekly_report --hf "${{ vars.HF_LOG_REPO }}" --purge
          else
            python -m scripts.weekly_report
          fi
      - name: Open the report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat reports/weekly.md
            echo
            n=$(python -c "import json;print(len(json.load(open('reports/freshness.json'))['affected_items']))")
            if [ "$n" -gt 0 ]; then echo; echo "---"; cat reports/freshness.md; fi
            echo; echo "cc @${{ github.repository_owner }}"
          } > issue.md
          cat issue.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "Weekly report $(date +%F)" --body-file issue.md
